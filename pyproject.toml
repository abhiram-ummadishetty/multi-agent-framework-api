[project]
name = "multi-agent-framework-api"
version = "0.1.0"
description = "API for a multi-agent framework"
readme = "README.md"
requires-python = ">=3.10"
authors = [ { name = "sarath" } ]

dependencies = [
  "fastapi==0.115.5",
  "uvicorn[standard]==0.32.1",
  "python-multipart==0.0.12",
  "sse-starlette==2.1.3",
  "pydantic==2.10.3",
  "pydantic-settings==2.7.0",
  "httpx==0.27.2",
  "sqlalchemy==2.0.30",
  "psycopg[binary]==3.3.1",
  "aiosqlite==0.19.0",
  "greenlet==3.5.5",
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
