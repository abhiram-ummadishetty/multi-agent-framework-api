apiVersion: v1
kind: ConfigMap
metadata:
  name: multi-agent-framework-api-config
  namespace: multi-agent
  labels:
    app: multi-agent-framework-api
data:
  # ── Server ──────────────────────────────────────────────────────────────────
  APP_ENV: "development"
  API_HOST: "0.0.0.0"
  API_PORT: "8001"
  LOG_LEVEL: "info"
  ALLOWED_ORIGINS: '["http://ui.local","http://localhost:5173","http://localhost:3000","http://localhost:8080"]'

  # ── LLM Provider ─────────────────────────────────────────────────────────────
  LLM_PROVIDER: "stub"
  OLLAMA_BASE_URL: "http://ollama-service:11434"
  OLLAMA_MODEL: "llama3.2"
  OPENAI_MODEL: "gpt-4o"
  ANTHROPIC_MODEL: "claude-3-5-sonnet-20241022"
  GEMINI_MODEL: "gemini-2.0-flash"

  # ── Embeddings ────────────────────────────────────────────────────────────────
  EMBEDDING_PROVIDER: "stub"
  EMBEDDING_MODEL: "text-embedding-3-small"

  # ── Vector Store ─────────────────────────────────────────────────────────────
  VECTOR_STORE_TYPE: "memory"
  CHROMA_HOST: "chroma-service"
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: "documents"
  PINECONE_ENVIRONMENT: ""
  PINECONE_INDEX_NAME: ""
  WEAVIATE_URL: ""
  WEAVIATE_CLASS_NAME: "Document"

  # ── Database ──────────────────────────────────────────────────────────────────
  DATABASE_URL: "sqlite:///./data/app.db"
  DB_POOL_SIZE: "10"
  DB_POOL_MAX_OVERFLOW: "20"
  DB_ECHO_SQL: "false"

  # ── File Upload ───────────────────────────────────────────────────────────────
  UPLOAD_DIR: "/data/uploads"
  MAX_UPLOAD_SIZE_MB: "50"

  # ── Agent Orchestration ───────────────────────────────────────────────────────
  AGENT_TIMEOUT_SECONDS: "120"
  MAX_CONCURRENT_AGENTS: "5"
  SESSION_TTL_SECONDS: "86400"

  # ── Observability ─────────────────────────────────────────────────────────────
  ENABLE_METRICS: "false"
