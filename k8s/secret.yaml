apiVersion: v1
kind: Secret
metadata:
  name: multi-agent-framework-api-secrets
  namespace: default
  labels:
    app: multi-agent-framework-api
type: Opaque
# ---------------------------------------------------------------------------
# IMPORTANT: Values here must be base64-encoded.
# Encode a value:  echo -n 'your-secret-value' | base64
# Decode to check: echo 'encoded-value' | base64 -d
#
# In production, prefer an external secrets manager:
#   - Kubernetes External Secrets Operator (ESO) with GCP Secret Manager / AWS SM / Vault
#   - Sealed Secrets (Bitnami)
#   - HashiCorp Vault Agent Injector
# ---------------------------------------------------------------------------
stringData:
  # stringData accepts plain text — Kubernetes base64-encodes it automatically.
  # Replace all placeholder values before applying.

  # ── Database ──────────────────────────────────────────────────────────────
  DATABASE_URL: "postgresql+psycopg://user:password@postgres-service:5432/agentdb"
  # For Cloud SQL local proxy, point at the proxy host and port:
  # DATABASE_URL: "postgresql+psycopg://user:password@127.0.0.1:5432/agentdb"
  # For SQLite in dev (no secret needed): sqlite+aiosqlite:///./data/app.db

  # ── LLM API Keys ──────────────────────────────────────────────────────────
  OPENAI_API_KEY: ""
  OPENAI_BASE_URL: ""
  # Leave blank unless using Azure OpenAI or a compatible proxy

  ANTHROPIC_API_KEY: ""

  GEMINI_API_KEY: ""

  # ── Vector Store API Keys ─────────────────────────────────────────────────
  PINECONE_API_KEY: ""

  WEAVIATE_API_KEY: ""

  # ── Observability ─────────────────────────────────────────────────────────
  SENTRY_DSN: ""
